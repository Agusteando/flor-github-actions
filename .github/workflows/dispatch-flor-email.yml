name: Dispatch Flor summary email

on:
  push:
    paths:
      - .dispatch/flor-email.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger sender workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTBOX_ID="$(jq -r '.outbox_id // empty' .dispatch/flor-email.json)"
          FORCE="$(jq -r '.force_resend // false' .dispatch/flor-email.json)"
          test -n "$OUTBOX_ID"
          gh workflow run send-outbox.yml --ref main -f outbox_id="$OUTBOX_ID" -f force_resend="$FORCE"
